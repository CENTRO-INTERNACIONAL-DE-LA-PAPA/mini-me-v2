# Runs when main changes. If the version in package.json has no tag yet, tags that commit, builds
# the Windows, macOS and Linux installers and uploads them, with their signed update files and
# latest.json, to a draft GitHub Release. Installed apps see the release once it is published. A
# change to main whose version is already tagged does nothing. To build again from scratch, delete
# the draft and the tag, then run this workflow on main by hand.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Two changes to main in quick succession are looked at one after the other.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tag is made here, from the version main carries, so it can only be on a commit of main
      # that has it. The draft is created once, so both build jobs upload to the same one; its
      # notes are CHANGELOG.md without its first line, which is the title GitHub already shows.
      # With no release ID, nothing is built.
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Releases are built from main, not from $GITHUB_REF." >&2
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1; then
            echo "$tag already exists, so this change to main releases nothing."
            exit 0
          fi
          node scripts/check-version.mjs "$tag"
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
          notes=$(tail -n +2 CHANGELOG.md | sed '/./,$!d')
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$tag" -f name="Mini-Me $version" \
            -f body="$notes" -F draft=true --jq .id)
          test -n "$id"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    if: needs.draft.outputs.release_id != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            bundles: nsis
          - runner: macos-latest # Apple silicon
            bundles: app,dmg
          # An AppImage links against the build machine's glibc, so the oldest supported
          # Ubuntu keeps it running on that release and newer ones.
          - runner: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: >-
            --config src-tauri/tauri.release.conf.json
            --config src-tauri/tauri.ci.conf.json
            --bundles ${{ matrix.bundles }}
