[project]
name = "mini-me-sidecar"
version = "0.1.0"
description = "Runs Mini-Me's Traits for the Rust core over a JSON-lines link."
requires-python = "==3.14.*"
dependencies = [
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.6.10",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.2",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
