[project]
name = "mini-me-sidecar"
version = "0.1.0"
description = "Runs Mini-Me's Traits for the Rust core over a JSON-lines link."
requires-python = "==3.14.*"
dependencies = [
    "asta",
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.6.10",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "markdown-it-py>=4.2.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pointblank>=1.1.1",
    "pyyaml>=6.0.3",
    "typesafe-sdk>=0.7.5",
    "typst>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
asta = { git = "https://github.com/allenai/asta-plugins", rev = "1ad7ae64dd80062ed5455366b3033991ee5a3be0" }

[dependency-groups]
dev = [
    "pytest>=9",
]
